permissions:
  defaultAction: ask
  deny:
    - command: [rm#recursive, rm#force]
      reason: no recursive/forced destructive deletion
    - command: [sudo]
      reason: no privilege escalation
    - command: [ssh]
      reason: no direct remote shell
    - paths: [.dsh/**]
      reason: protect harness metadata
    # `command` matches the decomposed command WORD only (`git`), so the
    # subcommand belongs in `args`. A multi-word entry such as `git pull` can
    # never match — see docs/rules-format.md §4.2.
    - command: [git]
      args: [push]
      branch:
        target: [main, master, "release*"]
        shared: true
      reason: no push to a protected branch
  allow:
    - command: [pnpm, node]
      reason: routine project development
    - command: [git]
      args: [pull]
      reason: routine project development
    - command: [npm]
      args: [run]
      reason: routine project development
    - command: [curl, wget]
      args: ["https://*.example.com/*"]
      reason: allowed package/registry endpoint
  ask:
    - command: [bash, sh, pwsh]
      reason: stateful or unlisted shell — semantic review